<header class="header sticky-header">
  <div class="container header__container">
    <a class="logo" href="./index.html" aria-label="Site logo">
      <svg class="logo__icon" width="100" height="30">
        <use href="{=$icon-path}"></use>
      </svg>
    </a>

    <form class="search-form">
      <input
        class="search-form__input"
        type="text"
        name="searchValue"
        placeholder="Enter product name"
      />
      <button
        type="button"
        class="search-form__btn-clear"
        aria-label="Clear search"
      >
        ×
      </button>
      <button class="search-form__btn" type="submit">Search</button>
    </form>

    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a class="nav__link {=$highlight-home}" href="./index.html">Home</a>
        </li>
        <li class="nav__item">
          <a class="nav__link {=$highlight-cart}" href="./cart.html">
            Cart
            <span class="nav__count" data-cart-count>0</span>
            <!-- Динамічне число -->
          </a>
        </li>
        <li class="nav__item">
          <a class="nav__link {=$highlight-wishlist}" href="./wishlist.html">
            Wishlist
            <span class="nav__count" data-wishlist-count>0</span>
            <!-- Динамічне число -->
          </a>
        </li>
      </ul>
    </nav>
    <button class="theme-toggle-btn" aria-label="Toggle theme">
      <svg class="theme-icon theme-icon-sun" width="32" height="32">
        <use href="./img/theme.svg#icon-sun"></use>
      </svg>
      <svg class="theme-icon theme-icon-moon" width="32" height="32">
        <use href="./img/theme.svg#icon-moon"></use>
      </svg>
<!--      <span class="theme-icon"></span> -->
    </button>
  </div>
</header>
